services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: subscriptionmanager-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SubsMgr@2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      # Aceitar conexão não basta: numa subida com volume já existente, o servidor
      # responde antes de terminar de recuperar o banco da aplicação, e a API acha
      # que ele não existe e tenta criá-lo. Quando o banco ainda não foi recuperado,
      # DATABASEPROPERTYEX devolve NULL e o healthcheck continua vermelho. Na
      # primeira subida o banco ainda não existe, e aí só o servidor é verificado.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"IF DB_ID('subscriptionmanager') IS NOT NULL AND DATABASEPROPERTYEX('subscriptionmanager','Collation') IS NULL RAISERROR('banco ainda em recuperacao', 16, 1) ELSE SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subscriptionmanager-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=subscriptionmanager;User Id=sa;Password=SubsMgr@2026;TrustServerCertificate=True"
      # Só no compose: deixa o projeto utilizável com um comando.
      Database__MigrateOnStartup: "true"
      Database__SeedOnStartup: "true"
      DisableHttpsRedirection: "true"
    ports:
      - "8080:8080"

volumes:
  sqlserver_data:
