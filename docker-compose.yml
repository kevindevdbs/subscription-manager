services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: subscriptionmanager-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SubsMgr@2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      # O SQL Server leva alguns segundos até aceitar conexão.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subscriptionmanager-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=subscriptionmanager;User Id=sa;Password=SubsMgr@2026;TrustServerCertificate=True"
      # Só no compose: deixa o projeto utilizável com um comando.
      Database__MigrateOnStartup: "true"
      Database__SeedOnStartup: "true"
      DisableHttpsRedirection: "true"
    ports:
      - "8080:8080"

volumes:
  sqlserver_data:
